[package]
name = "legit-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LeGit desktop application (Tauri 2.x)."
default-run = "legit-app"

[lib]
# Required so that `tauri::generate_context!()` works on mobile targets,
# and to make `cargo test` exercise the lib without launching the binary.
name = "legit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# `legit .` launcher support: a second invocation (LeGit.exe --open <locator>)
# forwards its argv to the running instance instead of starting another app.
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

legit-core = { workspace = true }
legit-providers = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
dirs = "6"
uuid = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }

shlex = "1"
base64 = "0.22"
# Console `| grep` stages (the console is not a shell; grep is built in).
regex = "1"
which = "8"
sha2 = "0.10"
# OS keychain for the in-app git credential prompt ("remember" checkbox).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
legit-watch = { workspace = true }
legit-host = { workspace = true }
legit-proto = { workspace = true }

[dev-dependencies]
tempfile = "3"
# test-util: paused-time (`start_paused`) for the console pump's paging tests.
tokio = { workspace = true, features = ["test-util"] }
# Scripted `GitExecutor` fakes (config-scope argv contracts).
async-trait = { workspace = true }

[features]
# Used by tauri-build to emit cfg flags.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# Default-WSL-distro lookup (HKCU\...\Lxss) — locale-proof, unlike parsing
# `wsl -l -v` output.
winreg = "0.55"
