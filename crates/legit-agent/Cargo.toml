[package]
name = "legit-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LeGit remote agent: runs next to the repository (WSL distro, later SSH host), executing git, repo-side file access, and the filesystem watcher over the stdio protocol."

