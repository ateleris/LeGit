name: On-demand build

# Build installable bundles on demand (Actions tab -> run workflow) and upload
# them as workflow artifacts, so a branch can be tried out without merging or
# cutting a release. Pick the branch via the ref dropdown and the platform or
# single installer format via the `target` input - `all` builds everything.
#
# Unlike release.yml this needs NO secrets: updater artifacts (which require
# the signing key) are disabled via a --config override, and nothing is
# published - artifacts expire after the retention period.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: all
        options:
          - all
          - windows
          - windows-msi
          - windows-exe
          - linux
          - linux-deb
          - linux-rpm
          - linux-appimage
          - macos
          - macos-apple-silicon
          - macos-intel

permissions:
  contents: read

# Re-dispatching the same target on the same ref cancels the stale run;
# different targets may run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  # The `matrix` context is not available in a job-level `if`, so the target
  # choice is applied here instead: this job emits only the matching matrix
  # legs for the build job's `fromJSON` include.
  plan:
    name: Resolve build matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGET: ${{ inputs.target }}
        run: |
          LEGS='[
            {"platform":"macos-latest","label":"macOS (Apple Silicon)",
             "targets":["all","macos","macos-apple-silicon"],
             "artifact":"LeGit-macos-apple-silicon",
             "rust-targets":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin",
             "bundle-paths":"target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"},
            {"platform":"macos-latest","label":"macOS (Intel)",
             "targets":["all","macos","macos-intel"],
             "artifact":"LeGit-macos-intel",
             "rust-targets":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin",
             "bundle-paths":"target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"},
            {"platform":"ubuntu-22.04","label":"Linux",
             "targets":["all","linux","linux-deb","linux-rpm","linux-appimage"],
             "rust-targets":"","args":""},
            {"platform":"windows-latest","label":"Windows",
             "targets":["all","windows","windows-msi","windows-exe"],
             "rust-targets":"","args":""}
          ]'
          MATRIX=$(jq -c --arg t "$TARGET" '[ .[] | select(.targets | index($t)) | del(.targets) ]' <<< "$LEGS")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # The Linux legit-agent binaries the Windows bundle ships (mirrors
  # release.yml - deployed into a WSL distro on first connect). Only needed
  # when a Windows bundle is built.
  build-agent:
    name: Build legit-agent (musl)
    if: contains(fromJSON('["all","windows","windows-msi","windows-exe"]'), inputs.target)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install musl + aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Build agents
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build -p legit-agent --release --target x86_64-unknown-linux-musl
          cargo build -p legit-agent --release --target aarch64-unknown-linux-musl
          mkdir -p agent-dist
          cp target/x86_64-unknown-linux-musl/release/legit-agent agent-dist/legit-agent-x86_64
          cp target/aarch64-unknown-linux-musl/release/legit-agent agent-dist/legit-agent-aarch64
      - name: Selftest (x86_64 runs on the runner)
        run: ./agent-dist/legit-agent-x86_64 --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: legit-agent
          path: agent-dist/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: [plan, build-agent]
    # build-agent being skipped is fine for non-Windows targets (only the
    # Windows bundle consumes its artifact, and plan emits no Windows leg
    # without it being scheduled); its failure blocks the build.
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.build-agent.result == 'success' || needs.build-agent.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Windows bundle ships the Linux agent binaries as resources
      # (src-tauri/tauri.windows.conf.json) for WSL remote repositories.
      - name: Stage legit-agent binaries (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: legit-agent
          path: src-tauri/agent/

      # Tauri v2 Linux system libraries (mirrors .github/workflows/ci.yml).
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install frontend dependencies
        run: npm ci

      # createUpdaterArtifacts needs the release signing key; on-demand builds
      # only need the installers, so switch it off for this invocation.
      - name: Write bundle config override
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > pr-bundle.conf.json

      # A single-format target packages only that bundle (the compile is the
      # same either way; this skips the other formats' packaging).
      - name: Resolve bundle restriction
        shell: bash
        run: |
          case "${{ inputs.target }}" in
            windows-msi)    echo "BUNDLES=--bundles msi" >> "$GITHUB_ENV" ;;
            windows-exe)    echo "BUNDLES=--bundles nsis" >> "$GITHUB_ENV" ;;
            linux-deb)      echo "BUNDLES=--bundles deb" >> "$GITHUB_ENV" ;;
            linux-rpm)      echo "BUNDLES=--bundles rpm" >> "$GITHUB_ENV" ;;
            linux-appimage) echo "BUNDLES=--bundles appimage" >> "$GITHUB_ENV" ;;
            *)              echo "BUNDLES=" >> "$GITHUB_ENV" ;;
          esac

      - name: Build bundles
        shell: bash
        run: npm run tauri:build -- --config pr-bundle.conf.json ${{ matrix.args }} $BUNDLES

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.artifact != ''
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle-paths }}
          retention-days: 14
          if-no-files-found: error

      # One artifact per installer format (mirrors the release assets), so
      # nobody downloads a second installer they don't need. Formats the
      # bundle restriction skipped are not uploaded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.platform == 'windows-latest' && inputs.target != 'windows-msi'
        with:
          name: LeGit-windows-setup-exe
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.platform == 'windows-latest' && inputs.target != 'windows-exe'
        with:
          name: LeGit-windows-msi
          path: target/release/bundle/msi/*.msi
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.platform == 'ubuntu-22.04' && inputs.target != 'linux-rpm' && inputs.target != 'linux-appimage'
        with:
          name: LeGit-linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.platform == 'ubuntu-22.04' && inputs.target != 'linux-deb' && inputs.target != 'linux-appimage'
        with:
          name: LeGit-linux-rpm
          path: target/release/bundle/rpm/*.rpm
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.platform == 'ubuntu-22.04' && inputs.target != 'linux-deb' && inputs.target != 'linux-rpm'
        with:
          name: LeGit-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error
