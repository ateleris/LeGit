name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src-tauri needs the Tauri v2 Linux system libraries to compile
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Includes the real-git integration harness (tests/git_flows.rs),
      # which needs a git binary on PATH; the runner provides one.
      - name: Run tests
        run: cargo test --workspace

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Heavier than the other jobs (full debug build + WebDriver stack); kept to
  # a two-spec smoke suite by design. See
  # docs/superpowers/specs/2026-07-10-e2e-ui-tests-design.md.
  e2e-tests:
    name: E2E UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies + WebDriver stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install dependencies
        run: npm ci

      # Debug build: much faster to compile than release, and the debug
      # binary's specta export / DEV title are harmless under test.
      - name: Build app (debug, no bundle)
        run: npm run tauri build -- --debug --no-bundle

      - name: Install E2E dependencies
        run: npm --prefix e2e ci

      - name: Run E2E tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm --prefix e2e test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: e2e/screenshots/
          if-no-files-found: ignore
