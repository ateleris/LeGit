name: Release

# Build native bundles on each OS and attach them to a GitHub Release when a
# version tag is pushed (e.g. `git tag v0.9.0 && git push origin v0.9.0`).
# The release is created as a DRAFT so the notes can be reviewed before it goes
# public — see RELEASING.md.
on:
  push:
    tags:
      - "v*"

# tauri-action creates the Release and uploads assets via GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  # Fail fast (before any platform build starts or a draft release is
  # created) if the pushed tag does not match the version in the sources —
  # otherwise a stale tree would ship installers named after the OLD version.
  verify-version:
    name: Verify tag matches source versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against Cargo.toml, tauri.conf.json, package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NPM=$(node -p "require('./package.json').version")
          echo "tag=$TAG  Cargo.toml=$CARGO  tauri.conf.json=$TAURI  package.json=$NPM"
          FAIL=0
          [ "$CARGO" = "$TAG" ] || { echo "::error file=Cargo.toml::workspace version is $CARGO but tag is v$TAG"; FAIL=1; }
          [ "$TAURI" = "$TAG" ] || { echo "::error file=src-tauri/tauri.conf.json::version is $TAURI but tag is v$TAG"; FAIL=1; }
          [ "$NPM" = "$TAG" ] || { echo "::error file=package.json::version is $NPM but tag is v$TAG"; FAIL=1; }
          if [ "$FAIL" -ne 0 ]; then
            echo "Version mismatch — bump the sources (see RELEASING.md), retag, and push again."
            exit 1
          fi
          # Changelog rule (2026-08-21): every release from v1.0.0 on must
          # have a "## [X.Y.Z]" section in CHANGELOG.md. Pre-1.0 tags skip
          # the check.
          if [ "$(printf '%s\n' '1.0.0' "$TAG" | sort -V | head -n1)" = "1.0.0" ]; then
            if ! grep -qF "## [$TAG]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::no '## [$TAG]' section — every release from 1.0.0 on must ship a changelog entry (see RELEASING.md)"
              exit 1
            fi
          fi

  release:
    name: Build ${{ matrix.label }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            label: macOS (Apple Silicon)
            rust-targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (cross-compiled on the arm runner)
            label: macOS (Intel)
            rust-targets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # .deb + .AppImage
            label: Linux
            rust-targets: ""
            args: ""
          - platform: windows-latest # .msi + NSIS .exe
            label: Windows
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux system libraries (mirrors .github/workflows/ci.yml).
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Runs the frontend build (beforeBuildCommand: `npm run build`), bundles
      # the app for this OS, then creates/updates the tag's GitHub Release and
      # uploads the installers.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LeGit ${{ github.ref_name }}"
          releaseBody: |
            Desktop Git GUI — download the installer for your OS below.

            Builds are **not code-signed**: your OS may warn on first launch
            (Windows SmartScreen → *More info → Run anyway*; macOS → right-click
            → *Open*).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
