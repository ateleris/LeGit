name: Release

# Build native bundles on each OS and attach them to a GitHub Release when a
# version tag is pushed (e.g. `git tag v0.9.0 && git push origin v0.9.0`).
# The release stays a DRAFT until every build and latest.json succeeded, then
# is published automatically - see RELEASING.md.
on:
  push:
    tags:
      - "v*"

# Least privilege for the default GITHUB_TOKEN: read-only by default; only
# the jobs that create the Release or upload to it get `contents: write`.
permissions:
  contents: read

jobs:
  # Fail fast (before any platform build starts or a draft release is
  # created) if the pushed tag does not match the version in the sources —
  # otherwise a stale tree would ship installers named after the OLD version.
  verify-version:
    name: Verify tag matches source versions
    runs-on: ubuntu-22.04
    outputs:
      release_notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare tag against Cargo.toml, tauri.conf.json, package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NPM=$(node -p "require('./package.json').version")
          echo "tag=$TAG  Cargo.toml=$CARGO  tauri.conf.json=$TAURI  package.json=$NPM"
          FAIL=0
          [ "$CARGO" = "$TAG" ] || { echo "::error file=Cargo.toml::workspace version is $CARGO but tag is v$TAG"; FAIL=1; }
          [ "$TAURI" = "$TAG" ] || { echo "::error file=src-tauri/tauri.conf.json::version is $TAURI but tag is v$TAG"; FAIL=1; }
          [ "$NPM" = "$TAG" ] || { echo "::error file=package.json::version is $NPM but tag is v$TAG"; FAIL=1; }
          if [ "$FAIL" -ne 0 ]; then
            echo "Version mismatch — bump the sources (see RELEASING.md), retag, and push again."
            exit 1
          fi
          # Changelog rule (2026-08-21): every release from v1.0.0 on must
          # have a "## [X.Y.Z]" section in CHANGELOG.md. Pre-1.0 tags skip
          # the check.
          if [ "$(printf '%s\n' '1.0.0' "$TAG" | sort -V | head -n1)" = "1.0.0" ]; then
            if ! grep -qF "## [$TAG]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::no '## [$TAG]' section — every release from 1.0.0 on must ship a changelog entry (see RELEASING.md)"
              exit 1
            fi
          fi

      # Release body = the tag's CHANGELOG.md section (guaranteed to exist by
      # the check above for >= 1.0.0) + the static download/signing footer.
      # Consumed by create-release below.
      - name: Assemble release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Everything between the tag's "## [X.Y.Z]" heading and the next
          # "## [" heading, minus leading blank lines (command substitution
          # strips trailing ones).
          NOTES=$(awk -v ver="$TAG" '
            /^## \[/ { if (found) exit; if ($0 ~ ("^## \\[" ver "\\]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')
          {
            echo "body<<NOTES_EOF"
            if [ -n "$NOTES" ]; then
              printf '%s\n\n---\n\n' "$NOTES"
            fi
            cat <<'FOOTER'
          Desktop Git GUI - download the installer for your OS below.

          Builds are **not code-signed**: your OS may warn on first launch.
          Windows SmartScreen → *More info → Run anyway*. macOS reports the
          app as "damaged" (Gatekeeper quarantine on unsigned apps): after
          copying LeGit to Applications, run
          `xattr -dr com.apple.quarantine /Applications/LeGit.app` in
          Terminal once, then launch normally.
          FOOTER
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # The Linux legit-agent binaries the WINDOWS bundle ships (deployed into a
  # WSL distro on first connect). Static musl so one binary runs on any
  # distro (glibc-any, Alpine included); both x86_64 and aarch64 (ARM64 WSL).
  build-agent:
    name: Build legit-agent (musl)
    needs: verify-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install musl + aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Build agents
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build -p legit-agent --release --target x86_64-unknown-linux-musl
          cargo build -p legit-agent --release --target aarch64-unknown-linux-musl
          mkdir -p agent-dist
          cp target/x86_64-unknown-linux-musl/release/legit-agent agent-dist/legit-agent-x86_64
          cp target/aarch64-unknown-linux-musl/release/legit-agent agent-dist/legit-agent-aarch64
      - name: Selftest (x86_64 runs on the runner)
        run: ./agent-dist/legit-agent-x86_64 --selftest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legit-agent
          path: agent-dist/
          if-no-files-found: error

  # One shared draft: per-job creation (tauri-action tagName mode) races and
  # splits the installers across several drafts.
  create-release:
    name: Create draft release
    needs: verify-version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create or reuse the tag's draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.verify-version.outputs.release_notes }}
        run: |
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) \(.draft)\"")
          COUNT=$(printf '%s' "$EXISTING" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::$COUNT releases exist for $GITHUB_REF_NAME - delete the extras first"
            exit 1
          fi
          if [ "$COUNT" -eq 1 ]; then
            read -r ID DRAFT <<< "$EXISTING"
            if [ "$DRAFT" != "true" ]; then
              echo "::error::release $GITHUB_REF_NAME is already published - refusing to upload into it"
              exit 1
            fi
            echo "Reusing draft release $ID"
          else
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="LeGit $GITHUB_REF_NAME" \
              -f body="$NOTES" -F draft=true -F prerelease=false --jq .id)
            echo "Created draft release $ID"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  release:
    name: Build ${{ matrix.label }}
    needs: [create-release, build-agent]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            label: macOS (Apple Silicon)
            rust-targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (cross-compiled on the arm runner)
            label: macOS (Intel)
            rust-targets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # .deb + .AppImage
            label: Linux
            rust-targets: ""
            args: ""
          - platform: windows-latest # .msi + NSIS .exe
            label: Windows
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Windows bundle ships the Linux agent binaries as resources
      # (src-tauri/tauri.windows.conf.json) for WSL remote repositories.
      - name: Stage legit-agent binaries (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legit-agent
          path: src-tauri/agent/

      # Tauri v2 Linux system libraries (mirrors .github/workflows/ci.yml).
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install frontend dependencies
        run: npm ci

      # Runs the frontend build (beforeBuildCommand: `npm run build`), bundles
      # the app for this OS, and uploads the installers + .sig files to the
      # draft Release. latest.json is written once by the updater-json job.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (bundle.createUpdaterArtifacts) - the
          # build FAILS without these repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Official release: keep the clean version - no `+<commit>` build
          # hash in About / the log banner (see src-tauri/build.rs).
          LEGIT_RELEASE_BUILD: "1"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Per-job latest.json rewrites race; updater-json writes it once.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  updater-json:
    name: Write latest.json
    needs: [create-release, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Assemble and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: node scripts/updater-json.mjs "$RELEASE_ID"

  publish:
    name: Publish release
    needs: [create-release, updater-json]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        # make_latest=legacy: a backport tag (older semver) must not take "Latest" from the newest release.
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=legacy --jq '"Published \(.html_url)"'
